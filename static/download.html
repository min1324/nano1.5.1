<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{background:#fff;border-radius:16px;padding:40px 32px;text-align:center;max-width:360px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.icon{width:64px;height:64px;margin:0 auto 20px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:16px;display:flex;align-items:center;justify-content:center}
.icon svg{width:32px;height:32px;fill:#fff}
h1{font-size:18px;color:#1e293b;margin-bottom:8px}
.name{font-size:14px;color:#64748b;margin-bottom:24px;word-break:break-all;line-height:1.5}
.btn{display:block;width:100%;padding:14px 0;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,0.4)}
.btn:active{transform:translateY(0)}
.btn.loading{opacity:0.7;pointer-events:none}
.tip{margin-top:16px;font-size:12px;color:#94a3b8}
.error{margin-top:12px;font-size:13px;color:#ef4444;display:none}
</style>
</head>
<body>
<div class="card">
<div class="icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6zm8-10V5.5L18.5 10H14z"/><path d="M12 18l-4-4h2.5v-3h3v3H16l-4 4z"/></svg></div>
<h1>文件下载</h1>
<p class="name" id="file-name"></p>
<a class="btn" id="download-btn" href="javascript:void(0)">点击下载</a>
<p class="tip">文件将直接下载到您的设备</p>
<p class="error" id="error-msg"></p>
</div>
<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var name = params.get('name') || '未知文件';
    var url = params.get('url') || '';
    document.getElementById('file-name').textContent = name;
    var btn = document.getElementById('download-btn');
    var errorMsg = document.getElementById('error-msg');

    if (!url) {
        btn.style.opacity = '0.5';
        btn.style.pointerEvents = 'none';
        return;
    }

    btn.addEventListener('click', function(e) {
        e.preventDefault();

        // 显示加载状态
        btn.textContent = '正在准备下载...';
        btn.classList.add('loading');
        errorMsg.style.display = 'none';

        // 使用fetch下载文件
        fetch(url)
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('下载失败 (' + response.status + ')');
                }
                return response.blob();
            })
            .then(function(blob) {
                // 创建下载链接
                var a = document.createElement('a');
                var blobUrl = URL.createObjectURL(blob);
                a.href = blobUrl;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                // 恢复按钮状态
                btn.textContent = '点击下载';
                btn.classList.remove('loading');
            })
            .catch(function(error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                // 恢复按钮状态
                btn.textContent = '点击下载';
                btn.classList.remove('loading');
            });
    });
})();
</script>
</body>
</html>
